<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="rainsday.com V3. A minimal FISH cover with a betta fish woven through type."
    >
    <title>rainsday.com | V3 Fish Index</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,35&family=Manrope:wght@400;500;600;700;800&display=swap"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="cursor" aria-hidden="true">
      <span class="cursor-dot"></span>
      <span class="cursor-ring"></span>
    </div>

    <main class="stage" id="top">
      <section class="poster" aria-labelledby="page-title">
        <div class="scene" aria-hidden="true">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/fish-sequence-03.png">
            <source src="assets/fish-hero-banner.mp4" type="video/mp4">
          </video>
        </div>

        <header class="poster-top">
          <a class="seal" href="../" aria-label="rainsday home">
            <span></span>
          </a>
          <p class="slogan">DESIGN CLEAN. MOVE FLUID.</p>
        </header>

        <h1 id="page-title" class="visually-hidden">FISH</h1>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
