<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="rainsday.com V3 — a minimal FISH cover with a betta fish woven through type."
    >
    <title>rainsday.com — V3 Fish Index</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,35&family=Manrope:wght@400;500;600;700;800&display=swap"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="cursor" aria-hidden="true">
      <span class="cursor-dot"></span>
      <span class="cursor-ring"></span>
    </div>

    <main class="stage" id="top">
      <section class="poster" aria-labelledby="page-title">
        <div class="scene" aria-hidden="true">
          <img src="assets/fish-word-bg.png" alt="">
        </div>

        <header class="poster-top">
          <a class="seal" href="../" aria-label="rainsday home">
            <span></span>
          </a>
          <div class="edition" aria-label="Version navigation">
            <a href="../">V1</a>
            <a href="../v2/">V2</a>
            <strong>V3</strong>
          </div>
          <p>DESIGN CLEAN. MOVE FLUID.</p>
        </header>

        <div class="panel-grid">
          <nav class="link-column" aria-label="Menu">
            <h2>MENU</h2>
            <a href="../">Home</a>
            <a href="mailto:hello@rainsday.com?subject=Service%20enquiry">Services</a>
            <a href="../#work">Work</a>
            <a href="../#mission">About</a>
            <a href="mailto:hello@rainsday.com">Contact</a>
          </nav>

          <div class="link-column" aria-label="Social links">
            <h2>SOCIALS</h2>
            <a href="https://x.com/" rel="noreferrer">X</a>
            <a href="https://www.instagram.com/" rel="noreferrer">Instagram</a>
            <a href="https://www.linkedin.com/" rel="noreferrer">LinkedIn</a>
          </div>

          <div class="link-column resources" aria-label="Resources">
            <h2>RESOURCES</h2>
            <a href="../#product">App design</a>
            <a href="mailto:hello@rainsday.com?subject=Newsletter">Newsletter</a>
            <a class="message" href="mailto:hello@rainsday.com" data-magnetic>Send a message</a>
          </div>
        </div>

        <div class="title-block visually-hidden">
          <p class="kicker">Hong Kong · interface design · iOS craft</p>
          <h1 id="page-title">FISH</h1>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
